name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      - name: Typecheck backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Lint frontend
        working-directory: client
        run: |
          npm ci
          npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build